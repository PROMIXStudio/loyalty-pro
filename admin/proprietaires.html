<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propriétaires — Loyalty Pro Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{--ink:#0d0d1a;--ink2:#1a1a2e;--indigo:#4338ca;--indigo-l:#e0e7ff;--violet:#6d28d9;--gold:#f59e0b;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--muted:#64748b;--border:#e2e8f0;--bg:#f1f5f9;--surface:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:250px;background:var(--ink2);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;padding:1.5rem 1rem;z-index:100;transition:transform .3s;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:1.5rem;flex-shrink:0}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-txt{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#fff}
.logo-txt span{color:var(--gold)}
.logo-badge{font-size:9px;font-weight:700;background:var(--indigo);color:#fff;padding:2px 6px;border-radius:4px;margin-left:auto;text-transform:uppercase}
.nav-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1.5px;padding:0 10px;margin:1rem 0 .5rem;display:block;width:100%}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.55);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:all .2s;width:100%}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(67,56,202,.6),rgba(109,40,217,.4));color:#fff}
.nav-item .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid rgba(255,255,255,.08)}
.admin-info{display:flex;align-items:center;gap:10px;padding:10px 12px}
.admin-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.admin-nm{font-size:12px;font-weight:600;color:#fff}
.admin-rl{font-size:11px;color:rgba(255,255,255,.35)}
.btn-logout{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;width:100%;background:rgba(239,68,68,.1);color:#fca5a5;border:none;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;margin-top:8px;transition:all .2s}
.btn-logout:hover{background:rgba(239,68,68,.2)}
/* MAIN */
.main{margin-left:250px;flex:1;padding:2rem;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.topbar h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--ink)}
.topbar p{font-size:13px;color:var(--muted);margin-top:2px}
/* BOUTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:.6rem 1.2rem;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--indigo);color:var(--indigo)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:.35rem .75rem;font-size:12px}
/* CARDS */
.card{background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:1.5rem}
.card-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:1.25rem}
/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #f8fafc;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%}
.b-actif{background:#d1fae5;color:#065f46}.b-actif::before{background:#10b981}
.b-essai{background:#dbeafe;color:#1e40af}.b-essai::before{background:#3b82f6}
.b-alerte{background:#fef3c7;color:#92400e}.b-alerte::before{background:#f59e0b}
.b-critique{background:#fee2e2;color:#991b1b}.b-critique::before{background:#ef4444}
.b-expire{background:#f3f4f6;color:#374151}.b-expire::before{background:#9ca3af}
.b-suspendu{background:#fce7f3;color:#9d174d}.b-suspendu::before{background:#ec4899}
/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.modal-title{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg)}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
.form-control{width:100%;padding:.65rem .9rem;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;background:var(--surface);transition:border .2s;color:var(--ink)}
.form-control:focus{border-color:var(--indigo)}
textarea.form-control{resize:vertical;min-height:100px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:toastIn .3s ease;max-width:320px}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.info{background:var(--indigo)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* SPINNER */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* EMPTY */
.empty-state{text-align:center;padding:2.5rem;color:var(--muted);font-size:13px}
/* HAMBURGER */
.hamburger{display:none;position:fixed;top:1rem;left:1rem;z-index:200;background:var(--indigo);color:#fff;border:none;border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer;align-items:center;justify-content:center}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .mob-overlay.show{display:block}
  .main{margin-left:0;padding:1rem;padding-top:4rem}
  .hamburger{display:flex}
  .form-row{grid-template-columns:1fr}
}
@media(max-width:1100px){
  .stats-grid{grid-template-columns:repeat(2,1fr)!important}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .mob-overlay.show{display:block}.main{margin-left:0;padding:1rem;padding-top:4rem}
  .hamburger{display:flex}.form-row{grid-template-columns:1fr}
}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:220px}
.search-box input{width:100%;padding:.6rem 1rem .6rem 2.5rem;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;background:var(--surface);transition:border .2s}
.search-box input:focus{border-color:var(--indigo)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.table-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.avatar-sm{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.boutique-tags{display:flex;flex-wrap:wrap;gap:4px}
.boutique-tag{font-size:11px;padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--ink);cursor:pointer;transition:all .2s}
.boutique-tag:hover{background:var(--indigo-l);border-color:var(--indigo);color:var(--indigo)}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.qs-card{background:var(--surface);border-radius:12px;padding:1rem 1.25rem;border:1px solid var(--border);text-align:center}
.qs-val{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--ink)}
.qs-lbl{font-size:11px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>

<button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
<div class="mob-overlay" id="mob-overlay" onclick="toggleSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🏆</div>
    <div class="logo-txt">Loyalty<span>Pro</span></div>
    <span class="logo-badge">Admin</span>
  </div>
  <div class="nav-section">Principal</div>
  <a class="nav-item" href="dashboard.html"><span class="ico">📊</span> Tableau de bord</a>
  <a class="nav-item" href="boutiques.html"><span class="ico">🏪</span> Boutiques</a>
  <a class="nav-item active" href="proprietaires.html"><span class="ico">👥</span> Propriétaires</a>
  <a class="nav-item" href="abonnements.html"><span class="ico">📅</span> Abonnements</a>
  <div class="nav-section">Outils</div>
  <a class="nav-item" href="test-mode.html"><span class="ico">🧪</span> Mode test</a>
  <a class="nav-item" href="messages.html"><span class="ico">📣</span> Messages</a>
  <div class="sidebar-footer">
    <div class="admin-info">
      <div class="admin-av" id="admin-av">A</div>
      <div>
        <div class="admin-nm" id="admin-nm">Admin</div>
        <div class="admin-rl">Super administrateur</div>
      </div>
    </div>
    <button class="btn-logout" type="button" onclick="handleLogout()">🚪 Se déconnecter</button>
  </div>
</nav>

<main class="main">
<div class="topbar">
    <div><h1>👥 Propriétaires</h1><p id="topbar-sub">Chargement...</p></div>
    <button class="btn btn-ghost" onclick="exportCSV()">📥 Exporter CSV</button>
  </div>
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Rechercher par nom, email, téléphone, boutique..." oninput="filterProprios()">
    </div>
  </div>
  <div class="proprio-grid" id="proprio-grid">
    <div class="empty-state" style="grid-column:1/-1">⏳ Chargement...</div>
  </div>
</main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/auth.js"></script>
<script>

function handleLogout() { window.lpLogout ? window.lpLogout() : (sessionStorage.clear(), window.location.replace("index.html")); }
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('show');
}
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = (type==='success'?'✅ ':type==='error'?'⚠️ ':'ℹ️ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDatetime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtMontant(n) { return Number(n||0).toLocaleString('fr-FR') + ' F'; }
function getStatut(b) {
  if (b.statut === 'suspendu') return 'suspendu';
  const fin = b.abonnement?.fin?.toMillis?.() || 0;
  const diff = fin - Date.now();
  const jrs = Math.ceil(diff / 86400000);
  if (diff <= 0) return 'expire';
  if (jrs <= 1)  return 'critique';
  if (jrs <= 3)  return 'alerte';
  if (b.statut === 'essai') return 'essai';
  return 'actif';
}
function jrsRestants(b) {
  return Math.ceil(((b.abonnement?.fin?.toMillis?.() || 0) - Date.now()) / 86400000);
}
const BADGE_MAP = {
  actif:    ['b-actif',    '✅ Actif'],    essai:    ['b-essai',    '🔵 Essai'],
  alerte:   ['b-alerte',   '⚠️ Alerte'],   critique: ['b-critique', '🔴 Critique'],
  expire:   ['b-expire',   '⛔ Expiré'],   suspendu: ['b-suspendu', '🔒 Suspendu'],
};
function badgeHTML(st) {
  const [cls,lbl] = BADGE_MAP[st] || BADGE_MAP['expire'];
  return '<span class="badge ' + cls + '">' + lbl + '</span>';
}
function setBtn(btnId, spinId, txtId, on) {
  document.getElementById(btnId).disabled = on;
  document.getElementById(spinId).style.display = on ? 'block' : 'none';
  if (txtId) document.getElementById(txtId).style.opacity = on ? '0' : '1';
}

let allProprios = [];

async function loadProprios() {
  try {
    const snap = await db.collection('boutiques').get();
    const boutiques = snap.docs.map(d => ({id:d.id,...d.data()}));
    const map = {};
    boutiques.forEach(b => {
      const key = (b.email||b.proprietaire||'inconnu').toLowerCase().trim();
      if (!map[key]) map[key] = {email:b.email||'',nom:b.proprietaire||'—',telephone:b.telephone||'—',boutiques:[]};
      map[key].boutiques.push(b);
    });
    allProprios = Object.values(map).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));

    const totalClients = boutiques.reduce((s,b)=>s+(b.totalClients||0),0);
    document.getElementById('qs-proprios').textContent  = allProprios.length;
    document.getElementById('qs-boutiques').textContent = boutiques.length;
    document.getElementById('qs-clients').textContent   = totalClients >= 1000 ? (totalClients/1000).toFixed(1)+'k' : totalClients;
    document.getElementById('topbar-sub').textContent   = allProprios.length+' propriétaire'+(allProprios.length>1?'s':'')+' · '+boutiques.length+' boutique'+(boutiques.length>1?'s':'');

    filterProprios();
  } catch(e) {
    document.getElementById('proprio-tbody').innerHTML = '<tr><td colspan="6" class="empty-state">⚠️ Erreur : '+e.message+'</td></tr>';
  }
}

function filterProprios() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const list = q ? allProprios.filter(p =>
    p.nom.toLowerCase().includes(q) ||
    p.email.toLowerCase().includes(q) ||
    p.telephone.toLowerCase().includes(q) ||
    p.boutiques.some(b=>(b.nom||'').toLowerCase().includes(q))
  ) : allProprios;
  renderTable(list);
}

function renderTable(list) {
  const tbody = document.getElementById('proprio-tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">🔍 Aucun propriétaire trouvé</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(p => {
    const totalC  = p.boutiques.reduce((s,b)=>s+(b.totalClients||0),0);
    const actives = p.boutiques.filter(b=>getStatut(b)==='actif').length;
    const ini     = p.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'??';
    const bTags   = p.boutiques.map(b => {
      const st = getStatut(b);
      const [cls] = BADGE_MAP[st]||BADGE_MAP['expire'];
      return `<span class="boutique-tag ${cls}" onclick="window.location.href='boutiques.html'" title="${b.id}">${b.nom||b.id}</span>`;
    }).join('');

    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar-sm">${ini}</div>
          <div>
            <div style="font-weight:600;font-size:13.5px">${p.nom}</div>
            <div style="font-size:10px;color:var(--muted);font-family:monospace">${p.email||'—'}</div>
          </div>
        </div>
      </td>
      <td style="font-size:12px">
        <div>📞 ${p.telephone||'—'}</div>
      </td>
      <td>
        <div class="boutique-tags">${bTags}</div>
      </td>
      <td style="text-align:center">
        <span style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--success)">${actives}</span>
        <span style="font-size:11px;color:var(--muted)"> / ${p.boutiques.length}</span>
      </td>
      <td style="text-align:center;font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--indigo)">${totalC}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="window.location.href='boutiques.html'">
          Voir boutiques →
        </button>
      </td>
    </tr>`;
  }).join('');
}

function exportCSV() {
  if(!allProprios.length){toast('Aucune donnée.','error');return;}
  const rows=[['Propriétaire','Email','Téléphone','Nb Boutiques','Nb Clients','Boutiques'].join(';')];
  allProprios.forEach(p=>rows.push([p.nom,p.email,p.telephone,p.boutiques.length,p.boutiques.reduce((s,b)=>s+(b.totalClients||0),0),p.boutiques.map(b=>b.nom).join(' | ')].join(';')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF' + rows.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download='proprietaires-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('Export CSV téléchargé !','success');
}

loadProprios();
</script>
</body>
</html>
